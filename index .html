<title>بورتفوليو | فيديوهات الذكاء الاصطناعي والمونتاج</title>
<meta name="description" content="حازم الشعراوي، مونتير وصانع فيديوهات بالذكاء الاصطناعي. ريلز وإعلانات قصيرة ومشاهد سينمائية بـ Veo وFlow وCapCut.">
<meta name="theme-color" content="#070412">
<meta property="og:type" content="website">
<meta property="og:title" content="حازم الشعراوي | مونتاج وفيديوهات بالذكاء الاصطناعي">
<meta property="og:description" content="شاهد أعمالي في الريلز والإعلانات القصيرة والمشاهد السينمائية.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎬%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#070412; --surface:#0e0a21; --ink:#EAF1FF; --muted:#9AA6C7; --line:#2a2252;
  --cyan:#27E0FF; --magenta:#FF3FD0; --violet:#7B5CFF; --rec:#FF5C7A;
  --grad:linear-gradient(100deg,#27E0FF,#7B5CFF 55%,#FF3FD0);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--ink);font-family:"Rubik",Tahoma,"Segoe UI",sans-serif;line-height:1.8;overflow-x:hidden;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(700px 420px at 88% -4%,rgba(123,92,255,.30),transparent 70%),
  radial-gradient(600px 420px at 0% 30%,rgba(39,224,255,.12),transparent 70%),
  linear-gradient(rgba(122,140,255,.07) 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,rgba(122,140,255,.07) 1px,transparent 1px) 0 0/44px 44px,
  var(--bg);
  -webkit-mask-image:linear-gradient(#000 55%,rgba(0,0,0,.55));mask-image:linear-gradient(#000 55%,rgba(0,0,0,.55))}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 22px}

/* hero */
.hero{position:relative;padding:44px 0 30px}
.hero-grid{position:relative;display:grid;gap:34px;align-items:center}
@media(min-width:820px){.hero-grid{grid-template-columns:1.25fr 1fr;gap:56px}}
.hello{color:var(--cyan);font-weight:500;margin:0 0 6px;font-size:1.05rem}
.hero h1{font-size:clamp(2.8rem,10vw,5.4rem);line-height:1.12;margin:0 0 18px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero p.lead{max-width:30em;color:var(--muted);font-size:1.1rem;margin:0 0 28px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.cta{display:inline-block;background:linear-gradient(100deg,#27E0FF,#8FA2FF);color:#06030f;padding:13px 28px;border-radius:999px;text-decoration:none;font-weight:700;box-shadow:0 0 24px rgba(39,224,255,.28)}
.cta.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.cta.ghost:hover{border-color:var(--cyan);color:var(--cyan)}

/* portrait as a generated frame */
.frame{position:relative;max-width:300px;width:100%;margin-inline:auto;aspect-ratio:9/16;max-height:58vh;border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px rgba(39,224,255,.55),0 0 46px rgba(123,92,255,.38),0 30px 80px rgba(0,0,0,.5)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;animation:develop 1.8s cubic-bezier(.3,.7,.2,1) both}
@keyframes develop{0%{filter:blur(22px) saturate(.2) brightness(.35);transform:scale(1.08)}70%{filter:blur(2px) saturate(1) brightness(.95)}100%{filter:none;transform:none}}
.frame::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,4,18,.4),transparent 24%,transparent 68%,rgba(7,4,18,.7));pointer-events:none}
.scan{position:absolute;inset-inline:0;top:0;height:3px;z-index:3;background:linear-gradient(90deg,transparent,#27E0FF,#FF3FD0,transparent);box-shadow:0 0 22px 6px rgba(39,224,255,.55);animation:scan 1.8s cubic-bezier(.45,0,.3,1) both;pointer-events:none}
@keyframes scan{0%{top:0;opacity:1}92%{opacity:1}100%{top:100%;opacity:0}}
.corner{position:absolute;width:26px;height:26px;border:2px solid var(--cyan);z-index:2}
.c1{top:14px;left:14px;border-right:0;border-bottom:0}.c2{top:14px;right:14px;border-left:0;border-bottom:0}
.c3{bottom:14px;left:14px;border-right:0;border-top:0}.c4{bottom:14px;right:14px;border-left:0;border-top:0}
@media (prefers-reduced-motion:reduce){.frame img,.scan{animation:none}.scan{display:none}html{scroll-behavior:auto}}

section{padding:52px 0}
h2{font-size:1.8rem;margin:0 0 26px;font-weight:700;display:flex;align-items:center;gap:12px}
h2::before{content:"";width:5px;height:1.2em;border-radius:3px;background:var(--grad)}

/* works */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}
.work{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.work:hover{border-color:rgba(39,224,255,.7);box-shadow:0 0 0 1px rgba(39,224,255,.35),0 0 34px rgba(123,92,255,.28)}
.screen{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,#17103a,#07040f);display:grid;place-items:center;color:var(--ink)}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{all:unset;position:relative;z-index:1;cursor:pointer;display:grid;place-items:center;width:100%;height:100%}
.play:focus-visible .tri{outline:3px solid var(--cyan);outline-offset:3px}
.tri{width:62px;height:62px;border-radius:50%;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 28px rgba(39,224,255,.55);transition:transform .2s}
.play:hover .tri{transform:scale(1.1)}
.tri::after{content:"";border:11px solid transparent;border-right:17px solid #06030f;border-left:0;margin-right:3px}
.empty{padding:16px;font-size:.9rem;opacity:.8;text-align:center}
.screen img.th{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.work.v .screen{aspect-ratio:auto;height:min(72vh,540px)}
.meta{padding:16px 18px 20px}
.meta h3{margin:0 0 4px;font-size:1.1rem}
.meta p{margin:0 0 12px;color:var(--muted);font-size:.93rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.8rem;border:1px solid rgba(39,224,255,.35);background:rgba(39,224,255,.07);border-radius:999px;padding:1px 11px;color:var(--cyan)}

.about p{max-width:38em;color:var(--muted);font-size:1.07rem;margin:0}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.tools span{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-weight:600}
.tools span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px rgba(39,224,255,.8)}

.contact{border-top:1px solid var(--line);padding:44px 22px 20px}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.links a{display:inline-flex;align-items:center;gap:10px;padding:11px 24px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;font-weight:600}
.links a:hover{border-color:var(--cyan);color:var(--cyan)}
.copy{color:var(--muted);font-size:.85rem;padding-bottom:30px}
[hidden]{display:none!important}
.wh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}.wh h2{margin:0}
.wh .cta{border:0;font:inherit;font-weight:700;cursor:pointer}
dialog{width:min(440px,92vw);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:22px;font-family:inherit}
dialog::backdrop{background:rgba(4,2,12,.78)}
dialog h3{margin:0 0 14px}dialog label{display:block;color:var(--muted);font-size:.92rem}
dialog input{display:block;width:100%;margin:6px 0 14px;padding:10px 12px;background:#05030d;color:var(--ink);border:1px solid var(--line);border-radius:8px;font:inherit}
dialog .cta{font:inherit;font-weight:700;cursor:pointer;border:0}dialog .cta.ghost{border:1.5px solid var(--line)}
#fm{font-size:.88rem;color:var(--muted);margin:12px 0 0}
#fm code{display:block;direction:ltr;text-align:left;margin-top:8px;padding:10px;background:#05030d;border-radius:8px;font-size:.78rem;word-break:break-all;user-select:all}
.del{margin-inline-start:auto;font:inherit;font-size:.8rem;color:var(--rec);background:none;border:1px solid var(--rec);border-radius:999px;padding:1px 11px;cursor:pointer}
</style>
</head>

<script>
/* ===== عدّل هذا الجزء فقط ===== */
const CONFIG = {
  name: "حازم الشعراوي",
  tagline: "أصنع فيديوهات قصيرة بالذكاء الاصطناعي من الفكرة إلى النسخة النهائية، لتشدّ الانتباه من أول ثانية.",
  about: "أنا حازم الشعراوي، صانع فيديوهات ومونتير أعمل بالذكاء الاصطناعي. أتولّى كل مراحل العمل بنفسي: ابتكار الفكرة، وتوليد المشاهد بأدوات مثل Veo وFlow، ثم المونتاج وضبط الإيقاع والصوت والتدرج اللوني في CapCut وEdits. النتيجة فيديو متكامل بجودة احترافية، مصمَّم ليناسب المنصة التي سيُنشر عليها.",
  tools: ["Google Veo", "Google Flow", "CapCut", "Edits"],
  contact: { email: "Hazemsharawy2024@gmail.com", whatsapp: "201223741474", instagram: "", facebook: "https://www.facebook.com/share/1FzFoszBZ4/", tiktok: "https://www.tiktok.com/@dopamine4343", youtube: "https://www.youtube.com/@hazemsharawy-85", behance: "" },
  // url: رابط YouTube أو Vimeo. اتركه فارغاً ليظهر "قريباً". cover: رابط صورة غلاف مخصصة (اختياري). vertical: true/false لفرض شكل الإطار (يُكتشف تلقائياً لروابط Shorts).
  works: [
    { title: "ريل سينمائي بالذكاء الاصطناعي", desc: "من الفكرة إلى النسخة النهائية: مشاهد مولّدة بالكامل، مع مونتاج وتدرج لوني وصوت، كلها من تنفيذي.", tags: ["Veo", "Flow", "CapCut"], url: "https://youtube.com/shorts/Qft_fZekCMc" },
    { title: "إعلان عطر", desc: "إعلان قصير لمنصات التواصل يبرز فخامة المنتج، من الفكرة حتى المونتاج النهائي.", tags: ["إعلان", "مونتاج", "Edits"], url: "https://youtube.com/shorts/wyOdpA_9uZ4" },
    { title: "إعلان Skills Academy", desc: "إعلان قصير لأكاديمية Skills Academy، بفكرة ومشاهد ومونتاج من صنعي.", tags: ["إعلان", "Veo", "CapCut"], url: "https://youtube.com/shorts/tzZ0Nr1ymBY" },
    { title: "3D & AI Commercials", desc: "إعلانات قصيرة بتقنيات ثلاثية الأبعاد والذكاء الاصطناعي، منفّذة بالكامل من الفكرة إلى التسليم.", tags: ["3D", "AI", "إعلان"], url: "https://youtube.com/shorts/4U1XO8d3Iw0" },
    { title: "ريل قصير", desc: "فيديو قصير بالذكاء الاصطناعي، من فكرتي وتنفيذي.", tags: ["AI", "ريلز"], url: "https://youtube.com/shorts/oVW2iFwXB-8" },
  ]
};
    { title: "AI Video Creation & Editing", desc: "Created & Edited by me", tags: ["AI", "مونتاج"], url: "https://youtube.com/shorts/KraIx-VPcPk" },
/* ============================== */

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function embedUrl(u){
  if(!u) return "";
  let m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
  if(m) return "https://www.youtube.com/embed/" + m[1] + "?autoplay=1&rel=0";
  m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return "https://player.vimeo.com/video/" + m[1] + "?autoplay=1";
  return "";
}
$("name").textContent = CONFIG.name;
document.title = CONFIG.name + " | بورتفوليو";
$("tagline").textContent = CONFIG.tagline;
$("about").textContent = CONFIG.about;
$("year").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name;
$("tools").innerHTML = CONFIG.tools.map(t => `<span>${esc(t)}</span>`).join("");

const thumbs = u => { const m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/); return m ? ["hq720","hqdefault","mqdefault"].map(n => "https://i.ytimg.com/vi/" + m[1] + "/" + n + ".jpg") : []; };
function thNext(img){ const a = JSON.parse(img.dataset.alt || "[]"); if(a.length){ img.dataset.alt = JSON.stringify(a.slice(1)); img.src = a[0]; } else img.remove(); }
if(location.hash === "#admin"){ try{ localStorage.setItem("pf_admin","1"); }catch(e){} }
const KEY = "pf_works", ADMIN = (() => { try { return localStorage.getItem("pf_admin") === "1"; } catch(e) { return false; } })();
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e) { return []; } };
const save = l => { try { localStorage.setItem(KEY, JSON.stringify(l)); } catch(e) {} };
let WORKS = [];
function render(){
  WORKS = CONFIG.works.concat(load().map(w => Object.assign({}, w, {local:true})))
    .filter(w => embedUrl(w.url)).filter((w,i,a) => a.findIndex(x => x.url === w.url) === i);
  $("grid").innerHTML = WORKS.map((w,i) => {
    const th = (w.cover ? [w.cover] : []).concat(thumbs(w.url));
    const v = w.vertical ?? /\/shorts\//.test(w.url);
    const img = th.length ? `<img class="th" src="${esc(th[0])}" data-alt="${esc(JSON.stringify(th.slice(1)))}" alt="" loading="lazy" onerror="thNext(this)">` : "";
    return `<article class="work${v ? " v" : ""}"><div class="screen" id="s${i}">${img}<button class="play" data-i="${i}" aria-label="تشغيل ${esc(w.title)}"><span class="tri"></span></button></div>
    <div class="meta"><h3>${esc(w.title)}</h3><p>${esc(w.desc || "")}</p>
    <div class="tags">${(w.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}${ADMIN && w.local ? `<button class="del" data-d="${i}" type="button">حذف</button>` : ""}</div></div></article>`;
  }).join("");
}
$("grid").addEventListener("click", e => {
  const d = e.target.closest(".del");
  if(d){ const w = WORKS[+d.dataset.d]; save(load().filter(x => x.url !== w.url)); render(); return; }
  const b = e.target.closest(".play"); if(!b) return;
  const i = +b.dataset.i;
  $("s"+i).innerHTML = `<iframe src="${embedUrl(WORKS[i].url)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${esc(WORKS[i].title)}"></iframe>`;
});
render();
if(ADMIN){
  $("add").hidden = false;
  $("add").onclick = () => { $("fm").innerHTML = ""; $("dlg").showModal(); };
  $("fx").onclick = () => $("dlg").close();
  $("f").addEventListener("submit", e => {
    e.preventDefault();
    const url = $("fu").value.trim();
    if(!embedUrl(url)){ $("fm").textContent = "الرابط غير مدعوم. استخدم رابط YouTube أو Vimeo."; return; }
    const w = { title: $("ft").value.trim() || "عمل جديد", desc: $("fd").value.trim(), tags: [], url };
    const l = load(); l.push(w); save(l); render();
    $("fm").innerHTML = `تمت الإضافة في هذا المتصفح فقط. لتظهر للجميع الصق هذا السطر داخل <b>works</b> في الملف:<code>${esc(JSON.stringify(w))},</code>`;
    $("f").reset();
  });
